# BiaPy version: 3.6.8

SYSTEM:
    NUM_CPUS: 12
    NUM_WORKERS: 12

PROBLEM:
    TYPE: INSTANCE_SEG
    NDIM: 3D
    INSTANCE_SEG:
        DATA_CHANNELS: ['F', 'C', 'Db', 'Dn']
        WATERSHED:
            SEED_CHANNELS: ['C']
            SEED_CHANNELS_THRESH: [0.3]
            SEED_MORPH_SEQUENCE: []
            TOPOGRAPHIC_SURFACE_CHANNEL: 'Db'
            GROWTH_MASK_CHANNELS: ['F']
            GROWTH_MASK_CHANNELS_THRESH: ['auto']

            DATA_REMOVE_BEFORE_MW: True
            DATA_REMOVE_SMALL_OBJ_BEFORE: 50     # same rough voxel threshold as above
            SEED_MORPH_SEQUENCE: ['erode', 'dilate']
            SEED_MORPH_RADIUS: [1, 1]
            ERODE_AND_DILATE_GROWTH_MASK: True
            FORE_EROSION_RADIUS: 1
            FORE_DILATION_RADIUS: 1
            DATA_CHECK_MW: True

DATA: 
    PATCH_SIZE: (20, 128, 128, 3)
    TRAIN:
        PATH: fisbe/biapy-channel-scale/train/raw
        GT_PATH: fisbe/biapy-channel-scale/train/label
        IN_MEMORY: True
    VAL:
        PATH: fisbe/biapy-no-aug/val/raw
        GT_PATH: fisbe/biapy-no-aug/val/label
    TEST:
        PATH: fisbe/biapy-no-aug/test/raw
        GT_PATH: fisbe/biapy-no-aug/test/label
        IN_MEMORY: True
        LOAD_GT: True
        PADDING: (4,16,16)

AUGMENTOR:
    ENABLE: False
    RANDOM_ROT: False
    VFLIP: False
    HFLIP: False
    ZFLIP: False


PATHS:
    CHECKPOINT_FILE: metrics/biapy/biapy-v1-channel-scale/checkpoints/biapy-v1-channel-scale_0-checkpoint-best.pth

MODEL:
    ARCHITECTURE: unet
    FEATURE_MAPS: [16, 32, 64, 128, 256]
    Z_DOWN: [1,1,1,1]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    OPTIMIZER: ADAMW
    LR: 3.E-3
    BATCH_SIZE: 105
    EPOCHS: 30
    PATIENCE: 10
    LR_SCHEDULER:
        NAME: 'onecycle'    # use one-cycle learning rate scheduler
  
TEST:
    ENABLE: True
    AUGMENTATION: False
    FULL_IMG: False
    POST_PROCESSING:
        INSTANCE_REFINEMENT:
            ENABLE: True
            OPERATIONS: ['remove_small_objects']
            VALUES: [50]   # voxel count threshold — tune based on your smallest real neuron