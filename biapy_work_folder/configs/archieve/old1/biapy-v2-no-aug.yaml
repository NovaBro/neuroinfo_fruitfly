# BiaPy version: 3.6.8

SYSTEM:
    NUM_CPUS: 12
    NUM_WORKERS: 12

PROBLEM:
    TYPE: INSTANCE_SEG
    NDIM: 3D
    INSTANCE_SEG:
      DATA_CHANNELS: ['F', 'P']
      DATA_CHANNELS_EXTRA_OPTS:
        - P:
            type: 'skeleton'   # not 'centroid' — centroids are useless for long arbors
            # dilation: 1        # try 1 first; 2 if seeds are too sparse/broken
            # erosion: 0
            dilation: 2        # try 1 first; 2 if seeds are too sparse/broken
            erosion: 0
      DATA_CHANNEL_WEIGHTS: (1.0, 10.0)   # upweight sparse P vs dense F
      WATERSHED:
        SEED_CHANNELS: ['F', 'P']
        SEED_CHANNELS_THRESH: ['auto', 'auto']    # or try 0.3–0.5 after inspecting P
        GROWTH_MASK_CHANNELS: ['F']
        GROWTH_MASK_CHANNELS_THRESH: ['auto']
        TOPOGRAPHIC_SURFACE_CHANNEL: 'F'
        DATA_REMOVE_BEFORE_MW: True
        DATA_REMOVE_SMALL_OBJ_BEFORE: 100     # same rough voxel threshold as above
        DATA_CHECK_MW: True


DATA: 
    PATCH_SIZE: (20, 128, 128, 3)
    TRAIN:
        PATH: fisbe/biapy-no-aug/train/raw
        GT_PATH: fisbe/biapy-no-aug/train/label
        IN_MEMORY: True
    VAL:
        PATH: fisbe/biapy-no-aug/val/raw
        GT_PATH: fisbe/biapy-no-aug/val/label
    TEST:
        PATH: fisbe/biapy-no-aug/test/raw
        GT_PATH: fisbe/biapy-no-aug/test/label
        IN_MEMORY: True
        LOAD_GT: True
        PADDING: (4,16,16)

AUGMENTOR:
    ENABLE: False
    RANDOM_ROT: False
    VFLIP: False
    HFLIP: False
    ZFLIP: False


PATHS:
    CHECKPOINT_FILE: metrics/biapy/biapy-v2-no-aug/checkpoints/biapy-v2-no-aug_0-checkpoint-best.pth

MODEL:
    ARCHITECTURE: unet
    FEATURE_MAPS: [16, 32, 64, 128, 256]
    Z_DOWN: [1,1,1,1]
    LOAD_CHECKPOINT: False

TRAIN:
    ENABLE: True
    OPTIMIZER: ADAMW
    LR: 6.E-3
    BATCH_SIZE: 180
    EPOCHS: 30
    PATIENCE: 10
    LR_SCHEDULER:
        NAME: 'onecycle'    # use one-cycle learning rate scheduler
  
TEST:
    ENABLE: True
    AUGMENTATION: False
    FULL_IMG: False
    POST_PROCESSING:
        INSTANCE_REFINEMENT:
            ENABLE: True
            OPERATIONS: ['remove_small_objects']
            VALUES: [250]   # voxel count threshold — tune based on your smallest real neuron