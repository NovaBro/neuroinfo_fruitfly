# BiaPy 3.7.0 -- synth MCFO 1k_v1_u8 (3-ch uint8 raw), F+Dc+Dn+skeleton-recall; hparams from the raytune FDcDn-skel winner.
# Data tree: fisbe/biapy-1k_v1_u8-zarr (sbatch/biapy/biapy_prep_1k_sbatch.sh). Train with SRC_ROOT=fisbe/biapy-1k_v1_u8-zarr.
SYSTEM:
  NUM_CPUS: 12
  NUM_WORKERS: 12
PROBLEM:
  TYPE: INSTANCE_SEG
  NDIM: 3D
  INSTANCE_SEG:
    DATA_CHANNELS: ['F', 'Dc', 'Dn']
    DATA_CHANNELS_EXTRA_OPTS:
    - Dc:
        type: skeleton
        mask_values: false
      Dn:
        mask_values: false
        decline_power: 2
    DATA_CHANNEL_WEIGHTS: (1.0, 1.0, 1.0)
    WATERSHED:
      SEED_CHANNELS: ['Dc','Dn'] 
      SEED_CHANNELS_THRESH: ['auto', 0.05]
      TOPOGRAPHIC_SURFACE_CHANNEL: F
      GROWTH_MASK_CHANNELS:
      - F
      GROWTH_MASK_CHANNELS_THRESH:
      - auto
      DATA_CHECK_MW: true
DATA:
  PATCH_SIZE: (80, 128, 128, 3)
  TRAIN:
    PATH: fisbe/biapy-1k_v1_u8-zarr/train/raw
    GT_PATH: fisbe/biapy-1k_v1_u8-zarr/train/label
    INPUT_IMG_AXES_ORDER: ZYXC
    INPUT_MASK_AXES_ORDER: ZYXC
    IN_MEMORY: false
  VAL:
    PATH: fisbe/biapy-1k_v1_u8-zarr/val/raw
    GT_PATH: fisbe/biapy-1k_v1_u8-zarr/val/label
    FROM_TRAIN: false
    INPUT_IMG_AXES_ORDER: ZYXC
    INPUT_MASK_AXES_ORDER: ZYXC
    IN_MEMORY: false
  TEST:
    PATH: fisbe/biapy-1k_v1_u8-zarr/test/raw
    GT_PATH: fisbe/biapy-1k_v1_u8-zarr/test/label
    INPUT_IMG_AXES_ORDER: ZYXC
    INPUT_MASK_AXES_ORDER: ZYXC
    IN_MEMORY: false
    LOAD_GT: true
    PADDING: (4,16,16)
AUGMENTOR:
  ENABLE: true
  AUG_SAMPLES: true
  CHANNEL_SHUFFLE: true
  RANDOM_ROT: false
  ROT90: true
  VFLIP: true
  HFLIP: true
  ZFLIP: true
  BRIGHTNESS: true
  BRIGHTNESS_FACTOR: (-0.2, 0.2)
  CONTRAST: true
  CONTRAST_FACTOR: (-0.2, 0.2)
  ELASTIC: false
  AFFINE_MODE: reflect
MODEL:
  ARCHITECTURE: seunet
  FEATURE_MAPS:
  - 16
  - 32
  - 64
  - 128
  - 256
  Z_DOWN:
  - 1
  - 1
  - 1
  - 1
  LOAD_CHECKPOINT: false
TRAIN:
  ENABLE: true
  OPTIMIZER: ADAMW
  LR: 0.0003300014839942648
  BATCH_SIZE: 12
  EPOCHS: 240
  LR_SCHEDULER:
    NAME: onecycle
    MIN_LR: 1.0e-05
    WARMUP_COSINE_DECAY_EPOCHS: 20
LOSS:
  SKELETON_RECALL:
    ENABLE: true
    WEIGHT: 0.28843584880065115
    TUBE_DILATIONS: 1
    TARGET_CHANNEL: F
TEST:
  ENABLE: false
  REUSE_PREDICTIONS: false
  AUGMENTATION: false
  FULL_IMG: false
  BY_CHUNKS:
    ENABLE: true
    FORMAT: zarr
    SAVE_OUT_TIF: true
    INPUT_IMG_AXES_ORDER: ZYXC
    WORKFLOW_PROCESS:
      ENABLE: true
      TYPE: entire_pred
  POST_PROCESSING:
    INSTANCE_REFINEMENT:
      ENABLE: true
      OPERATIONS:
      - remove_small_objects
      VALUES:
      - 1000
