# experiment_v3 shape overlay: 160^3 same-padding crops, batch size 1 (4.10 M loss voxels / it; current net:
# 18 x 52^3 = 2.53 M). Stack after expv3_s6d2w{64,32}.toml.
# Constraint: training.compile (Inductor) fails to compile the loss kernel once the 343-channel patch output
# has >= 2^31 elements (smoke 23537164: int64/uint32 indexing error at 2 x 160^3 x 343 = 2.81e9), so with compile
# batch_size x crop^3 must stay < 6.26 M voxels. The eager loss is a full-size elementwise BCE as well.
[model]
train_input_shape_same = [160, 160, 160]
# val crops during training (validation.py); predict tiles come from expv3_predict.toml
test_input_shape_same = [160, 160, 160]

[training]
batch_size = 1
# 72 x bs1 = 72 val crops, the same count as earlier runs (4 x bs18)
val_num_batches = 72
cache_size = 40
