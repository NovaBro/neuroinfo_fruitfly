# Layer B2: patch/fc=0.3, drop single-patch CCs. params_product includes
# includeSinglePatchCCS so this does not overwrite the th=0.3 baseline HDF.
# Stack: default_l40s + basic_long8h + this + eval_rm0
[validation]
params_product = [ "mws", "skeletonize_foreground", "numinst_threshs", "includeSinglePatchCCS",]

[vote_instances]
patch_threshold = 0.3
fc_threshold = 0.3
ignore_small_comps = 100
mws = true
includeSinglePatchCCS = false
skeletonize_foreground = true
