# Overlay on original_default_train_code.toml + fmaps24 + 400k, all augs on but cheapened, L40S-friendly.
# Train: ./sbatch/ppp/ppp_submit_train.sh base1-decoder-c --base original_default_train_code.toml --id base1-decoder-c --time 08:00:00 --account torch_pr_61_general
# Smoke Train: ./sbatch/ppp/ppp_submit_train.sh base1-decoder-c --base original_default_train_code.toml --id base1-decoder-c-smoke --config smoke.toml --time 00:30:00 --account torch_pr_61_tandon_advanced
# Optional: 
    # --id base1-decoder-c-smoke 
    # --config smoke.toml 
    # --time 00:30:00
    # --account torch_pr_61_tandon_advanced
# Test ./sbatch/ppp/ppp_submit_test.sh array base1-decoder-c --split test --ckpt 16000 --pct 4 --base original_default_train_code.toml

[data]
# FISBe zarr volumes (run prepare_fisbe_for_ppp.py once before training)
fisbe_root = "/scratch/wmz2007/neuroinfo_fruitfly/fisbe"
# Preferred: name folders under fisbe_root (each must contain train/val/test).
# When set, train_data/val_data/test_data are derived as
# {fisbe_root}/{first_dataset}/{split}. Inference outputs use {dataset}/{sample}.
# Including a name with "partly" auto-enables add_partly / add_partly_val.
train_datasets = ["completely"]
val_datasets = ["completely"]
test_datasets = ["completely"]
overlap_csv_folder = ""
fg_csv_folder = "/scratch/wmz2007/neuroinfo_fruitfly/fisbe/fg_points"
numinst_key = "volumes/gt_numinst"
sample_mask_key = "volumes/gt_fg_rm_5"
add_partly = false
sample_fg_points = true
# Limit volumes for faster iteration during local debugging
max_train_samples = 18
max_val_samples = 10

[model]
num_fmaps = 20
train_input_shape_valid = [ 140, 140, 140,]
test_input_shape_valid = [ 156, 156, 156,]
train_code = true
upsampling = "transposed_conv"
decode_batch_size = 1024

[model.autoencoder]
upsampling = "nearest"

[training]
val_log_step = 2000
# H200
# batch_size = 30
# num_workers = 12
# cache_size = 300
# L40s
batch_size = 22
num_workers = 30
cache_size = 150
prefetch_batches = 2
max_iterations = 400000
checkpoints = 2000
snapshots = 5000
profiling = 2000
probability_hue = 0.05
use_gt_extra = false
# Fisbe dataset incomplete I think. Missing file that tells which instances are missing in partly dataset
oversample_complete = 1
mask_bg_weight = 0.01

[prediction]
batch_size = 8
num_workers = 32
cache_size = 200
mask_folder = ""

[validation]
checkpoints = [400000]

[testing]
num_workers = 32

[vote_instances]
num_workers = 32

[evaluation]
num_workers = 32
from_scratch = true
add_general_metrics = ["avg_gt_skel_coverage", "avg_f1_cov_score", "false_merge", "false_split"]
summary = [ "general.Num GT", "general.Num Pred", "general.avg_f1_cov_score", "confusion_matrix.avFscore", "confusion_matrix.avFscore19", "general.avg_gt_skel_coverage", "general.TP_05_rel", "general.avg_TP_05_cldice", "general.FM", "general.FS", "confusion_matrix.th_0_5.avg_tp_skel_coverage",
"confusion_matrix.th_0_1.fscore", "confusion_matrix.th_0_2.fscore", "confusion_matrix.th_0_3.fscore", "confusion_matrix.th_0_4.fscore", "confusion_matrix.th_0_5.fscore", "confusion_matrix.th_0_6.fscore", "confusion_matrix.th_0_7.fscore", "confusion_matrix.th_0_8.fscore", "confusion_matrix.th_0_9.fscore",
"confusion_matrix.th_0_5.AP_TP", "confusion_matrix.th_0_5.AP_FP",
"confusion_matrix.th_0_5.AP_FN", "confusion_matrix.th_0_5.false_split",
"confusion_matrix.th_0_5.false_merge"
]

[optimizer.optimizer]
optimizer = "Adam"
# H200
# lr = 0.00005
# L40S
lr = 0.00005

[training.sampling]
min_masked = 0.0001
probability_random = 0.05
probability_fg = 0.95
probability_overlap = 0.0
# No overlap_csv_folder, so probability_overlap = 0.0
point_balance_radius_overlap = 3

[training.augmentation.elastic]
control_point_spacing = [40, 40, 40]
jitter_sigma = [0.5, 0.5, 0.5]
rotation_min = -15
rotation_max = 15
subsample = 8

[training.augmentation.overlay]
probability_overlay = 0.05