# Overlay on default_l40s.toml — fmaps24 + 400k, all augs on but cheapened, L40S-friendly.
# Usage: --config .../default_l40s.toml --config .../basic_fmaps24_400k_aug_cheap.toml
# Train: ./sbatch/ppp/ppp_submit.sh train fmaps24_400k_aug_cheap
# Exp id: ppp_basic_fmaps24_400k_aug_cheap

[data]
test_data = "/scratch/wmz2007/neuroinfo_fruitfly/fisbe/completely/val"

[model]
num_fmaps = 24

[training]
batch_size = 1
max_iterations = 400002
checkpoints = 5000
snapshots = 10000
profiling = 1000
probability_hue = 0.1
num_workers = 32
cache_size = 48
val_log_step = 100

# Keep elastic/overlay enabled; cheapen vs default_l40s.toml
[training.augmentation.elastic]
control_point_spacing = [40, 40, 40]
jitter_sigma = [0.5, 0.5, 0.5]
rotation_min = -15
rotation_max = 15
subsample = 8

[training.augmentation.overlay]
probability_overlay = 0.1

[prediction]
batch_size = 1

[validation]
checkpoints = [400002]
